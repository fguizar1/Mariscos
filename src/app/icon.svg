<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tenedor" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="420">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Tenedor inclinado -->
  <g transform="rotate(-35 256 256)" filter="url(#shadow)" fill="none" stroke="url(#metal)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 4 puntas -->
    <g stroke-width="22">
      <line x1="196" y1="96" x2="196" y2="200"/>
      <line x1="236" y1="96" x2="236" y2="236"/>
      <line x1="276" y1="96" x2="276" y2="236"/>
      <line x1="316" y1="96" x2="316" y2="200"/>
    </g>
    <!-- Base curva que une las puntas -->
    <path d="M196 190 C196 262 226 282 256 290 C286 282 316 262 316 190" stroke-width="22"/>
    <!-- Mango -->
    <line x1="256" y1="285" x2="256" y2="410" stroke-width="30"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
